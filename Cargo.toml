[package]
name = "degenview"
version = "0.1.0"
edition = "2024"
description = "A native macOS market dashboard, rewritten in Rust"
license = "GPL-3.0-only"

[dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSWindow",
    "NSWindowTabGroup",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSNotification",
    "NSObject",
    "NSString",
] }

[profile.release]
lto = "thin"
strip = true
