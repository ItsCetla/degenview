[package]
name = "degenview"
version = "0.1.0"
edition = "2024"
description = "A native macOS market dashboard, rewritten in Rust"
license = "GPL-3.0-only"

[dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
egui_extras = { version = "0.36.2", features = ["all_loaders"] }
# egui_extras builds `image` without JPEG; CoinGecko serves many coin icons as .jpg.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.33", features = ["bundled"] }
tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
ureq = "3.4.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
libc = "0.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = [
    "NSAccessibilityProtocols",
    "NSApplication",
    "NSGraphics",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSWindow",
    "NSWindowTabGroup",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSNotification",
    "NSObject",
    "NSRunLoop",
    "NSString",
] }
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
objc2-user-notifications = { version = "0.3.2", features = [
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[profile.release]
lto = "thin"
strip = true
